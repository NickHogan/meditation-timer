<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Simple meditation timer with interval bells">
    <title>Meditation Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 300px;
        }

        /* Control Row */
        .control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .control-value {
            font-size: 0.85rem;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            color: #444;
            min-width: 50px;
            text-align: right;
        }

        .control-bar {
            flex: 1;
            height: 32px;
            background: #111;
            border-radius: 4px;
            cursor: ew-resize;
            touch-action: none;
        }

        /* Circle Buttons */
        .btn-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px solid #333;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 3rem auto 0;
            transition: border-color 0.2s;
        }

        .btn-circle:hover {
            border-color: #555;
        }

        .btn-circle:active {
            border-color: #666;
        }

        /* Stop button - circle within circle */
        .btn-stop-inner {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #333;
            background: transparent;
            pointer-events: none;
        }

        .btn-circle:hover .btn-stop-inner {
            border-color: #555;
        }

        /* Timer Screen */
        .timer-screen {
            display: none;
        }

        .timer-screen.active {
            display: block;
        }

        .setup-screen.hidden {
            display: none;
        }

        .timer-time {
            font-size: 3rem;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            color: #444;
            text-align: center;
            letter-spacing: 2px;
        }

        .timer-progress {
            width: 100%;
            height: 1px;
            background: #1a1a1a;
            margin: 2rem 0;
        }

        .timer-progress-bar {
            height: 100%;
            background: #333;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Setup Screen -->
        <div class="setup-screen" id="setupScreen">
            <div class="control">
                <div class="control-value" id="durationDisplay">10:00</div>
                <div class="control-bar" id="barDuration"></div>
            </div>

            <div class="control">
                <div class="control-value" id="intervalDisplay">5:00</div>
                <div class="control-bar" id="barInterval"></div>
            </div>

            <button class="btn-circle" id="startBtn"></button>
        </div>

        <!-- Timer Screen -->
        <div class="timer-screen" id="timerScreen">
            <div class="timer-time" id="timeRemaining">10:00</div>

            <div class="timer-progress">
                <div class="timer-progress-bar" id="progressBar" style="width: 100%;"></div>
            </div>

            <button class="btn-circle" id="stopBtn">
                <div class="btn-stop-inner"></div>
            </button>
        </div>
    </div>

    <audio id="bellSound" preload="auto">
        <source src="bell.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Elements
        const setupScreen = document.getElementById('setupScreen');
        const timerScreen = document.getElementById('timerScreen');
        const barDuration = document.getElementById('barDuration');
        const barInterval = document.getElementById('barInterval');
        const durationDisplay = document.getElementById('durationDisplay');
        const intervalDisplay = document.getElementById('intervalDisplay');
        const timeRemaining = document.getElementById('timeRemaining');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const bellSound = document.getElementById('bellSound');

        // State
        let durationMinutes = 10;
        let intervalSecs = 300; // stored in seconds
        let timerInterval = null;
        let totalSeconds = 0;
        let initialSeconds = 0;
        let intervalSeconds = 0;
        let nextIntervalAt = 0;

        // Settings persistence
        function saveSettings() {
            localStorage.setItem('meditationSettings', JSON.stringify({
                duration: durationMinutes,
                intervalSecs: intervalSecs
            }));
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('meditationSettings');
                if (saved) {
                    const settings = JSON.parse(saved);
                    durationMinutes = settings.duration || 10;
                    intervalSecs = settings.intervalSecs || 300;
                }
            } catch (e) {
                console.log('Could not load settings:', e);
            }
        }

        // Load saved settings
        loadSettings();

        // Bar interaction (horizontal drag)
        function setupBar(barEl, getValue, setValue, maxValue, updateDisplay) {
            let isDragging = false;
            let startX = 0;
            let startValue = 0;
            const sensitivity = 2; // pixels per unit

            function onStart(e) {
                isDragging = true;
                startX = e.touches ? e.touches[0].clientX : e.clientX;
                startValue = getValue();
                e.preventDefault();
            }

            function onMove(e) {
                if (!isDragging) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const deltaX = currentX - startX;
                const deltaValue = Math.round(deltaX / sensitivity);
                const newValue = Math.min(maxValue, Math.max(1, startValue + deltaValue));
                setValue(newValue);
                updateDisplay();
                e.preventDefault();
            }

            function onEnd() {
                if (isDragging) {
                    isDragging = false;
                    saveSettings();
                }
            }

            barEl.addEventListener('mousedown', onStart);
            barEl.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        }

        function formatMinutes(mins) {
            return `${mins}:00`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDurationDisplay() {
            durationDisplay.textContent = formatMinutes(durationMinutes);
        }

        function updateIntervalDisplay() {
            intervalDisplay.textContent = formatTime(intervalSecs);
        }

        // Interval stepping: 15s increments below 5min, 60s above
        function stepInterval(current, delta) {
            let newVal;
            if (current < 300) {
                // Below 5 min: 15 second steps
                newVal = current + (delta * 15);
                if (newVal >= 300) newVal = Math.round(newVal / 60) * 60;
            } else {
                // At or above 5 min: 60 second steps
                newVal = current + (delta * 60);
                if (newVal < 300) newVal = 285; // 4:45 when stepping down from 5:00
            }
            return Math.min(3600, Math.max(15, newVal));
        }

        // Setup bars
        setupBar(
            barDuration,
            () => durationMinutes,
            (v) => { durationMinutes = v; },
            180, // max 3 hours
            updateDurationDisplay
        );

        // Custom interval bar with stepping
        (function() {
            const barEl = barInterval;
            let isDragging = false;
            let startX = 0;
            let startValue = 0;
            const sensitivity = 8;

            function onStart(e) {
                isDragging = true;
                startX = e.touches ? e.touches[0].clientX : e.clientX;
                startValue = intervalSecs;
                e.preventDefault();
            }

            function onMove(e) {
                if (!isDragging) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const deltaX = currentX - startX;
                const steps = Math.round(deltaX / sensitivity);
                intervalSecs = stepInterval(startValue, steps);
                updateIntervalDisplay();
                e.preventDefault();
            }

            function onEnd() {
                if (isDragging) {
                    isDragging = false;
                    saveSettings();
                }
            }

            barEl.addEventListener('mousedown', onStart);
            barEl.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        })();

        // Initialize displays
        updateDurationDisplay();
        updateIntervalDisplay();

        function playBell(times = 1) {
            let count = 0;
            function playOnce() {
                if (count < times) {
                    bellSound.currentTime = 0;
                    bellSound.play().catch(e => console.log('Audio play failed:', e));
                    count++;
                    if (count < times) {
                        setTimeout(playOnce, 2500);
                    }
                }
            }
            playOnce();
        }

        function startTimer() {
            totalSeconds = durationMinutes * 60;
            initialSeconds = totalSeconds;
            intervalSeconds = intervalSecs;

            if (intervalSeconds > 0) {
                nextIntervalAt = totalSeconds - intervalSeconds;
            } else {
                nextIntervalAt = -1;
            }

            setupScreen.classList.add('hidden');
            timerScreen.classList.add('active');
            timeRemaining.textContent = formatTime(totalSeconds);
            updateProgress();

            playBell(1);

            timerInterval = setInterval(() => {
                totalSeconds--;
                timeRemaining.textContent = formatTime(totalSeconds);
                updateProgress();

                if (intervalSeconds > 0 && totalSeconds === nextIntervalAt && totalSeconds > 0) {
                    playBell(1);
                    nextIntervalAt -= intervalSeconds;
                }

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    playBell(3);
                }
            }, 1000);
        }

        function updateProgress() {
            const progress = (totalSeconds / initialSeconds) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            setupScreen.classList.remove('hidden');
            timerScreen.classList.remove('active');
        }

        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
