<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Simple meditation timer with interval bells">
    <title>Meditation Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8e8e8;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Dial Container */
        .dial-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 1.5rem;
        }

        .dial {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: grab;
            touch-action: none;
        }

        .dial:active {
            cursor: grabbing;
        }

        /* Duration Dial (outer) */
        .dial-duration {
            width: 280px;
            height: 280px;
            background: conic-gradient(from -90deg, #4a9eff 0deg, #4a9eff var(--angle, 90deg), rgba(255,255,255,0.1) var(--angle, 90deg), rgba(255,255,255,0.1) 360deg);
            box-shadow:
                0 0 60px rgba(74, 158, 255, 0.3),
                inset 0 0 60px rgba(0,0,0,0.5);
        }

        .dial-duration::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            background: linear-gradient(145deg, #1e1e3a, #151530);
            border-radius: 50%;
        }

        /* Interval Dial (inner) */
        .dial-interval {
            width: 160px;
            height: 160px;
            background: conic-gradient(from -90deg, #ff6b9d 0deg, #ff6b9d var(--angle, 45deg), rgba(255,255,255,0.08) var(--angle, 45deg), rgba(255,255,255,0.08) 360deg);
            box-shadow:
                0 0 40px rgba(255, 107, 157, 0.2),
                inset 0 0 30px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .dial-interval::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            background: linear-gradient(145deg, #1e1e3a, #151530);
            border-radius: 50%;
        }

        /* Dial knob indicator */
        .dial-knob {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            z-index: 3;
        }

        .dial-interval .dial-knob {
            width: 12px;
            height: 12px;
            top: 6px;
        }

        /* Center display */
        .dial-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .time-display {
            font-size: 2.8rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: #fff;
        }

        .time-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-top: 0.3rem;
        }

        .interval-display {
            font-size: 0.9rem;
            color: #ff6b9d;
            margin-top: 0.8rem;
            opacity: 0.9;
        }

        /* Tick marks */
        .tick-marks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            top: 4px;
            left: 50%;
            transform-origin: center 136px;
        }

        .tick.major {
            height: 12px;
            background: rgba(255,255,255,0.6);
        }

        /* Start Button */
        .btn-start {
            width: 100%;
            padding: 1.1rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #4a9eff 0%, #6c5ce7 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start:active {
            transform: scale(0.98);
            box-shadow: 0 5px 20px rgba(74, 158, 255, 0.3);
        }

        /* Timer Display Screen */
        .timer-screen {
            display: none;
        }

        .timer-screen.active {
            display: block;
        }

        .setup-screen.hidden {
            display: none;
        }

        .timer-circle {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 1.5rem;
        }

        .timer-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from -90deg, #4a9eff var(--progress, 100%), rgba(255,255,255,0.1) var(--progress, 100%));
            box-shadow:
                0 0 60px rgba(74, 158, 255, 0.3),
                inset 0 0 60px rgba(0,0,0,0.5);
        }

        .timer-ring::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            background: linear-gradient(145deg, #1e1e3a, #151530);
            border-radius: 50%;
        }

        .timer-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .timer-time {
            font-size: 3.5rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            color: #fff;
        }

        .timer-status {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-top: 0.5rem;
        }

        .btn-stop {
            width: 100%;
            padding: 1.1rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            color: #fff;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-stop:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.15);
        }

        .interval-info {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 1rem;
        }

        /* Instructions */
        .instructions {
            font-size: 0.7rem;
            opacity: 0.4;
            margin-top: 1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Meditation</h1>

        <!-- Setup Screen -->
        <div class="setup-screen" id="setupScreen">
            <div class="dial-container">
                <!-- Duration Dial (outer) -->
                <div class="dial dial-duration" id="dialDuration" style="--angle: 90deg;">
                    <div class="dial-knob"></div>
                    <div class="tick-marks" id="tickMarks"></div>
                </div>

                <!-- Interval Dial (inner) -->
                <div class="dial dial-interval" id="dialInterval" style="--angle: 45deg;">
                    <div class="dial-knob"></div>
                </div>

                <!-- Center Display -->
                <div class="dial-center">
                    <div class="time-display" id="durationDisplay">10:00</div>
                    <div class="time-label">Duration</div>
                    <div class="interval-display" id="intervalDisplay">Bell every 5 min</div>
                </div>
            </div>

            <button class="btn-start" id="startBtn">Begin</button>

            <p class="instructions">
                Outer ring: Duration &nbsp;&bull;&nbsp; Inner ring: Interval
            </p>
        </div>

        <!-- Timer Screen -->
        <div class="timer-screen" id="timerScreen">
            <div class="timer-circle">
                <div class="timer-ring" id="timerRing" style="--progress: 100%;"></div>
                <div class="timer-center">
                    <div class="timer-time" id="timeRemaining">10:00</div>
                    <div class="timer-status" id="status">Meditating</div>
                </div>
            </div>

            <button class="btn-stop" id="stopBtn">End Session</button>
            <p class="interval-info" id="intervalInfo"></p>
        </div>
    </div>

    <audio id="bellSound" preload="auto">
        <source src="bell.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Elements
        const setupScreen = document.getElementById('setupScreen');
        const timerScreen = document.getElementById('timerScreen');
        const dialDuration = document.getElementById('dialDuration');
        const dialInterval = document.getElementById('dialInterval');
        const durationDisplay = document.getElementById('durationDisplay');
        const intervalDisplay = document.getElementById('intervalDisplay');
        const timeRemaining = document.getElementById('timeRemaining');
        const timerRing = document.getElementById('timerRing');
        const statusEl = document.getElementById('status');
        const intervalInfo = document.getElementById('intervalInfo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const bellSound = document.getElementById('bellSound');

        // State
        let durationMinutes = 10;
        let intervalMinutes = 5;
        let timerInterval = null;
        let totalSeconds = 0;
        let initialSeconds = 0;
        let intervalSeconds = 0;
        let nextIntervalAt = 0;

        // Generate tick marks for duration dial
        const tickMarks = document.getElementById('tickMarks');
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
            tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
            tickMarks.appendChild(tick);
        }

        // Dial interaction
        function setupDial(dialEl, getValue, setValue, maxValue, updateDisplay) {
            let isDragging = false;

            function getAngleFromEvent(e) {
                const rect = dialEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let angle = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI) + 90;
                if (angle < 0) angle += 360;
                return angle;
            }

            function updateFromAngle(angle) {
                const value = Math.round((angle / 360) * maxValue);
                setValue(Math.max(1, value));
                dialEl.style.setProperty('--angle', `${angle}deg`);

                // Rotate knob
                const knob = dialEl.querySelector('.dial-knob');
                if (knob) {
                    knob.style.transform = `translateX(-50%) rotate(${angle}deg)`;
                    knob.style.transformOrigin = `center ${dialEl.offsetWidth / 2}px`;
                }

                updateDisplay();
            }

            function onStart(e) {
                isDragging = true;
                const angle = getAngleFromEvent(e);
                updateFromAngle(angle);
                e.preventDefault();
            }

            function onMove(e) {
                if (!isDragging) return;
                const angle = getAngleFromEvent(e);
                updateFromAngle(angle);
                e.preventDefault();
            }

            function onEnd() {
                isDragging = false;
            }

            dialEl.addEventListener('mousedown', onStart);
            dialEl.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);

            // Initialize display
            const initialAngle = (getValue() / maxValue) * 360;
            dialEl.style.setProperty('--angle', `${initialAngle}deg`);
            const knob = dialEl.querySelector('.dial-knob');
            if (knob) {
                knob.style.transform = `translateX(-50%) rotate(${initialAngle}deg)`;
                knob.style.transformOrigin = `center ${dialEl.offsetWidth / 2}px`;
            }
        }

        function formatMinutes(mins) {
            return `${mins}:00`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDurationDisplay() {
            durationDisplay.textContent = formatMinutes(durationMinutes);
        }

        function updateIntervalDisplay() {
            if (intervalMinutes === 0) {
                intervalDisplay.textContent = 'No interval bells';
            } else {
                intervalDisplay.textContent = `Bell every ${intervalMinutes} min`;
            }
        }

        // Setup dials
        setupDial(
            dialDuration,
            () => durationMinutes,
            (v) => { durationMinutes = v; },
            60, // max 60 minutes
            updateDurationDisplay
        );

        setupDial(
            dialInterval,
            () => intervalMinutes,
            (v) => { intervalMinutes = v; },
            30, // max 30 minute intervals
            updateIntervalDisplay
        );

        // Initialize displays
        updateDurationDisplay();
        updateIntervalDisplay();

        function playBell(times = 1) {
            let count = 0;
            function playOnce() {
                if (count < times) {
                    bellSound.currentTime = 0;
                    bellSound.play().catch(e => console.log('Audio play failed:', e));
                    count++;
                    if (count < times) {
                        setTimeout(playOnce, 2500);
                    }
                }
            }
            playOnce();
        }

        function startTimer() {
            totalSeconds = durationMinutes * 60;
            initialSeconds = totalSeconds;
            intervalSeconds = intervalMinutes * 60;

            if (intervalSeconds > 0) {
                nextIntervalAt = totalSeconds - intervalSeconds;
                intervalInfo.textContent = `Bell every ${intervalMinutes} minute${intervalMinutes > 1 ? 's' : ''}`;
            } else {
                nextIntervalAt = -1;
                intervalInfo.textContent = 'No interval bells';
            }

            setupScreen.classList.add('hidden');
            timerScreen.classList.add('active');
            timeRemaining.textContent = formatTime(totalSeconds);
            statusEl.textContent = 'Meditating';
            updateTimerRing();

            playBell(1);

            timerInterval = setInterval(() => {
                totalSeconds--;
                timeRemaining.textContent = formatTime(totalSeconds);
                updateTimerRing();

                if (intervalSeconds > 0 && totalSeconds === nextIntervalAt && totalSeconds > 0) {
                    playBell(1);
                    nextIntervalAt -= intervalSeconds;
                }

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    statusEl.textContent = 'Complete';
                    playBell(3);
                }
            }, 1000);
        }

        function updateTimerRing() {
            const progress = (totalSeconds / initialSeconds) * 100;
            timerRing.style.setProperty('--progress', `${progress}%`);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            setupScreen.classList.remove('hidden');
            timerScreen.classList.remove('active');
        }

        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
